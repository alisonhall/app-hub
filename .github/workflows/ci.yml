name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  lint:
    # Lint results don't depend on the OS, so this runs once instead of
    # duplicating it across the test job's matrix below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        # Both OSes matter here: a lot of this codebase's logic (start
        # command shells, process tree kills, fnm/nvm path handling) is
        # platform-specific, and bugs have historically only shown up on one
        # OS or the other.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm test
