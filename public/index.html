<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>app-hub</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; }
  h1 { font-size: 1.4rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 0.9rem 0; border-bottom: 1px solid #8883; }
  .icon { font-size: 1.4rem; }
  .meta { flex: 1; }
  .name { font-weight: 600; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .desc { font-size: 0.85rem; opacity: 0.7; }
  .port { font-size: 0.75rem; opacity: 0.6; font-family: monospace; }
  .node-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 1rem; font-family: monospace; background: #8883; opacity: 0.75; }
  .node-badge.node-fallback { background: #9a6b0022; color: #9a6b00; opacity: 1; }
  .status { font-size: 0.75rem; padding: 0.2rem 0.55rem; border-radius: 1rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-running { background: #1a7f3722; color: #1a7f37; }
  .status-starting { background: #9a6b0022; color: #9a6b00; }
  .status-error, .status-stopped { background: #cf222e22; color: #cf222e; }
  .status-not-configured { background: #8883; color: inherit; opacity: 0.7; }
  .empty { opacity: 0.7; }
  .name span.unconfigured { opacity: 0.85; }
  button.toggle { font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 0.4rem; border: 1px solid #8886; background: transparent; cursor: pointer; }
  button.toggle:disabled { opacity: 0.5; cursor: default; }
  .git-badge { font-size: 0.95rem; opacity: 0.6; cursor: default; }
  .actions-row { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding-left: calc(1.4rem + 0.75rem); }
  button.action-btn { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 0.4rem; border: 1px dashed #8886; background: transparent; cursor: pointer; }
  button.action-btn:disabled { opacity: 0.5; cursor: default; }
  .action-result { font-size: 0.75rem; opacity: 0.7; }
</style>
</head>
<body>
  <h1>app-hub</h1>
  <ul id="apps"><li class="empty">Loading…</li></ul>

  <script src="client-helpers.js"></script>
  <script src="app.js"></script>
</body>
</html>
